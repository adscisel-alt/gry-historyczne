name: Gra Windows (EXE)

# Buduje „Damian Ściseł i Kapelusz Szyfrów” jako przenośny plik .exe dla Windows 10/11.
# Plik trafia do artefaktów przebiegu oraz do wydania „gra-windows” na GitHubie.
on:
  push:
    paths:
      - damian-kapelusz-szyfrow.html
      - windows/**
      - .github/workflows/windows-exe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Instalacja
        working-directory: windows
        run: npm ci
      - name: Budowa EXE
        working-directory: windows
        run: npm run exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Damian-Kapelusz-Szyfrow-Windows
          path: windows/dist/Damian-Kapelusz-Szyfrow.exe
      - name: Wydanie „gra-windows”
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gra-windows
          name: Damian Ściseł i Kapelusz Szyfrów — Windows
          body: Przenośna wersja gry dla Windows 10/11. Pobierz plik .exe i uruchom go dwuklikiem (bez instalacji).
          files: windows/dist/Damian-Kapelusz-Szyfrow.exe
