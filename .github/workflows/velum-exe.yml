name: VELUM – Windows EXE

# Buduje „VELUM — Odsłoń starożytny Rzym” do jednego pliku .exe na Windows
# (uruchamiacz w Go z wbudowaną grą, otwiera ją w oknie Edge/Chrome).
# Gotowy plik: zakładka Actions → ostatni przebieg → Artifacts → VELUM-Rzym-Windows.
on:
  push:
    branches: ["**"]
    paths:
      - "velum-rzym.html"
      - "velum-exe/**"
      - ".github/workflows/velum-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Budowa EXE
        working-directory: velum-exe
        run: |
          cp ../velum-rzym.html .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui" -o VELUM-Rzym.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: VELUM-Rzym-Windows
          path: velum-exe/VELUM-Rzym.exe
