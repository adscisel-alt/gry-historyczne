name: Kroniki Damiana Ścisła II – Windows EXE

# Buduje grę „Kroniki Damiana Ścisła II” (Python + Pygame) do jednego pliku .exe na Windows.
# Gotowy plik: zakładka Actions → ostatni przebieg → Artifacts → KronikiDamianaScisla2-Windows.
# Wypchnięcie tagu kroniki2-v* dodatkowo publikuje wydanie (Release) z plikiem .exe.
on:
  push:
    branches: ["**"]
    paths:
      - "kroniki-damiana-scisla-2/**"
      - ".github/workflows/kroniki2-exe.yml"
    tags:
      - "kroniki2-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lektor:
    # Nagrania lektora (Piper TTS, polski głos) – generowane na Ubuntu i przekazywane do budowy EXE.
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: kroniki-damiana-scisla-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lektor (Piper)
        run: |
          sudo apt-get install -y -q ffmpeg > /dev/null
          python -m pip install piper-tts
          python tools/make_voice.py
      - uses: actions/upload-artifact@v4
        with:
          name: lektor2
          path: kroniki-damiana-scisla-2/assets/voice

  windows-exe:
    needs: lektor
    if: always()
    runs-on: windows-latest
    defaults:
      run:
        working-directory: kroniki-damiana-scisla-2
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pobranie nagrań lektora
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lektor2
          path: kroniki-damiana-scisla-2/assets/voice
      - name: Zależności
        run: python -m pip install -r requirements.txt
      - name: Test – bot przechodzi całą kampanię
        run: python tests/bot_kampania.py 1
      - name: Kompilacja PyInstaller
        run: python -m PyInstaller --noconfirm KronikiDamianaScisla2.spec
      - name: Uruchomienie EXE i zrzuty ekranu
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\KronikiDamianaScisla2.exe -ArgumentList "--screenshots","zrzuty" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "EXE zakończył się kodem $($p.ExitCode)" }
          Get-ChildItem zrzuty
          if ((Get-ChildItem zrzuty -Filter *.png).Count -lt 10) { throw "Brak zrzutów ekranu" }
      - uses: actions/upload-artifact@v4
        with:
          name: KronikiDamianaScisla2-Windows
          path: |
            kroniki-damiana-scisla-2/dist/KronikiDamianaScisla2.exe
            kroniki-damiana-scisla-2/zrzuty/*.png
      - name: Wydanie (tylko dla tagów)
        if: startsWith(github.ref, 'refs/tags/kroniki2-v')
        uses: softprops/action-gh-release@v2
        with:
          files: kroniki-damiana-scisla-2/dist/KronikiDamianaScisla2.exe
