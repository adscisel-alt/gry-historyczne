name: Deploy Pages

# Publikuje zawartość repozytorium jako stronę GitHub Pages.
# Przy pierwszym uruchomieniu sam włącza Pages (enablement).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wersja przeglądarkowa „Kronik Damiana Ścisła” (pygbag)
        run: |
          python -m pip install pygbag piper-tts
          sudo apt-get install -y -q ffmpeg > /dev/null
          (cd kroniki-damiana-scisla && python tools/make_voice.py) || echo "Lektor niedostępny – budowa bez nagrań"
          bash kroniki-damiana-scisla/tools/build_web.sh
      - name: Wersje przeglądarkowe gier 3D z Godota (Zamość 3D, Dmowski 3D, Roman Empire 3D)
        run: |
          base=https://github.com/godotengine/godot/releases/download/4.3-stable
          curl -sSL -o /tmp/godot.zip "$base/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp && sudo mv /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o /tmp/szablony.tpz "$base/Godot_v4.3-stable_export_templates.tpz"
          d=~/.local/share/godot/export_templates/4.3.stable && mkdir -p $d
          unzip -joq /tmp/szablony.tpz templates/web_nothreads_release.zip templates/web_nothreads_debug.zip templates/version.txt -d $d
          rm -f /tmp/godot.zip /tmp/szablony.tpz
          python dmowski3d/narzedzia/generuj_lektora.py || echo "Lektor niedostępny – gra bez nagrań"
          python rzym3d/narzedzia/generuj_lektora.py || echo "Lektor niedostępny – Roman Empire bez nagrań"
          for g in zamosc3d dmowski3d rzym3d; do
            godot --headless --path $g/godot --import || true
            mkdir -p "$PWD/web_godot/$g"
            godot --headless --path $g/godot --export-release "Web" "$PWD/web_godot/$g/index.html"
            ls -la "web_godot/$g"
          done
      - name: Złożenie strony
        run: |
          mkdir -p ../_site
          rsync -a --exclude .git --exclude web_build --exclude web_godot --exclude '*/godot/.godot' --exclude 'rzym3d/build' ./ ../_site/
          for g in zamosc3d dmowski3d rzym3d; do
            mkdir -p ../_site/$g/graj && cp -r web_godot/$g/. ../_site/$g/graj/
          done
          mkdir -p ../_site/kroniki-damiana-scisla/graj
          cp -r kroniki-damiana-scisla/web_build/kroniki-damiana-scisla/build/web/. ../_site/kroniki-damiana-scisla/graj/
          mv ../_site ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
