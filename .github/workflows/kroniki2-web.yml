name: Kroniki Damiana Ścisła II – wersja przeglądarkowa

# Buduje grę do WebAssembly (pygbag) i sprawdza ją w Chromium (Playwright).
# Zbudowana strona i zrzut ekranu trafiają do Artifacts. Na gałęzi main stronę publikuje pages.yml.
on:
  push:
    branches: ["**"]
    paths:
      - "kroniki-damiana-scisla-2/**"
      - ".github/workflows/kroniki2-web.yml"
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kroniki-damiana-scisla-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Narzędzia
        run: |
          python -m pip install pygbag playwright pillow
          python -m playwright install --with-deps chromium
      - name: Lektor (Piper)
        continue-on-error: true
        run: |
          sudo apt-get install -y -q ffmpeg > /dev/null
          python -m pip install piper-tts
          python tools/make_voice.py
      - name: Budowanie (pygbag)
        run: bash tools/build_web.sh
      - name: Test w przeglądarce
        run: python tools/web_smoke.py web_build/kroniki-damiana-scisla-2/build/web web_zrzut.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KronikiDamianaScisla2-Web
          path: |
            kroniki-damiana-scisla-2/web_build/kroniki-damiana-scisla-2/build/web
            kroniki-damiana-scisla-2/web_zrzut*.png
