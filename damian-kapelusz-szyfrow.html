<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Damian Ściseł i Kapelusz Szyfrów</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b0714;
    -webkit-user-select:none;user-select:none;}
  #gra{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    image-rendering:auto;cursor:none;box-shadow:0 0 60px rgba(120,60,200,.35);}
</style>
</head>
<body>
<canvas id="gra" width="1280" height="720"></canvas>
<script>
"use strict";
/* =====================================================================
   DAMIAN ŚCISEŁ I KAPELUSZ SZYFRÓW
   Przygodowa gra point & click o cyberbezpieczeństwie.
   Wszystkie grafiki są rysowane proceduralnie na canvasie.
   ===================================================================== */

const W = 1280, H = 720, SH = 600;          // SH — wysokość sceny, pod nią pasek UI
const cv = document.getElementById('gra');
const ctx = cv.getContext('2d');

function dopasuj() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
addEventListener('resize', dopasuj); dopasuj();

/* ---------- narzędzia ---------- */
const rnd = (a, b) => a + Math.random() * (b - a);
function mulberry(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const czekaj = ms => new Promise(r => setTimeout(r, ms));
let teraz = performance.now();

function wPolu(pts, x, y) {           // punkt w wielokącie
  let w = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) w = !w;
  }
  return w;
}
function najblizszyWPolu(pts, x, y) {
  if (wPolu(pts, x, y)) return [x, y];
  let best = null, bd = 1e9;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [ax, ay] = pts[j], [bx, by] = pts[i];
    const dx = bx - ax, dy = by - ay;
    const t = clamp(((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy || 1), 0, 1);
    const px = ax + dx * t, py = ay + dy * t, d = (px - x) ** 2 + (py - y) ** 2;
    if (d < bd) { bd = d; best = [px, py]; }
  }
  // lekko do środka
  const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length, cy = pts.reduce((s, p) => s + p[1], 0) / pts.length;
  return [lerp(best[0], cx, .02), lerp(best[1], cy, .04)];
}

/* ---------- dźwięk (WebAudio, bez plików) ---------- */
const Dzwiek = {
  ac: null, wl: true, muzykaGain: null, nastroj: 'spokoj', krok: 0, timer: null,
  start() {
    if (this.ac) return;
    try {
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
      this.muzykaGain = this.ac.createGain(); this.muzykaGain.gain.value = .05;
      this.muzykaGain.connect(this.ac.destination);
      this.timer = setInterval(() => this.tik(), 230);
    } catch (e) { this.ac = null; }
  },
  ton(f, d = .12, typ = 'square', v = .06, kiedy = 0, cel = null) {
    if (!this.ac || !this.wl) return;
    const t = this.ac.currentTime + kiedy;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = typ; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(cel || this.ac.destination); o.start(t); o.stop(t + d + .02);
  },
  klik() { this.ton(660, .05, 'triangle', .05); },
  zbierz() { [523, 659, 784, 1046].forEach((f, i) => this.ton(f, .14, 'triangle', .07, i * .07)); },
  sukces() { [392, 523, 659, 784, 659, 784, 1046].forEach((f, i) => this.ton(f, .2, 'square', .045, i * .09)); },
  blad() { this.ton(196, .25, 'sawtooth', .05); this.ton(147, .3, 'sawtooth', .05, .12); },
  magia() { for (let i = 0; i < 10; i++) this.ton(800 + i * 140 + rnd(-40, 40), .1, 'sine', .04, i * .03); },
  grzmot() {
    if (!this.ac || !this.wl) return;
    const n = this.ac.sampleRate * 1.6, b = this.ac.createBuffer(1, n, this.ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.5);
    const s = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain();
    f.type = 'lowpass'; f.frequency.value = 400; g.gain.value = .5;
    s.buffer = b; s.connect(f); f.connect(g); g.connect(this.ac.destination); s.start();
  },
  // prosta muzyka proceduralna — wesoła w mieście, niepokojąca w Wieży Cienia
  tik() {
    if (!this.ac || !this.wl) return;
    const k = this.krok++;
    if (this.nastroj === 'spokoj') {
      const skala = [262, 294, 330, 392, 440, 523, 587];
      const mel = [0, 2, 4, 2, 3, 1, 0, -1, 4, 5, 4, 2, 3, 2, 1, -1];
      const n = mel[k % 16];
      if (n >= 0) this.ton(skala[n], .22, 'triangle', .5, 0, this.muzykaGain);
      if (k % 4 === 0) this.ton([131, 98, 110, 87][(k >> 4) % 4], .5, 'sine', .7, 0, this.muzykaGain);
    } else if (this.nastroj === 'napiecie') {
      if (k % 8 === 0) this.ton(55, 1.6, 'sawtooth', .5, 0, this.muzykaGain);
      if (k % 8 === 4) this.ton(58, 1.6, 'sawtooth', .4, 0, this.muzykaGain);
      if (k % 4 === 2) this.ton([440, 466, 415, 494][(k >> 2) % 4], .15, 'sine', .25, 0, this.muzykaGain);
      if (k % 6 === 0) { this.ton(60, .1, 'sine', 1.2, 0, this.muzykaGain); this.ton(55, .1, 'sine', 1, .14, this.muzykaGain); }
    } else if (this.nastroj === 'karczma') {
      const skala = [294, 330, 349, 392, 440, 466, 523];
      const mel = [0, 2, 4, 4, 3, 2, 1, -1, 2, 4, 6, 4, 3, 1, 0, -1];
      const n = mel[k % 16];
      if (n >= 0) this.ton(skala[n], .18, 'square', .25, 0, this.muzykaGain);
      if (k % 2 === 0) this.ton(k % 4 ? 220 : 147, .12, 'triangle', .5, 0, this.muzykaGain);
    }
  }
};

/* ---------- stan gry ---------- */
const NOWY_STAN = () => ({ scena: 'wieza', przedmioty: [], flagi: {}, lekcje: [], punkty: 0, px: 520, py: 540 });
let S = NOWY_STAN();
function zapisz() { try { localStorage.setItem('damian-kapelusz-zapis', JSON.stringify(S)); } catch (e) {} }
function wczytajZapis() { try { const z = localStorage.getItem('damian-kapelusz-zapis'); return z ? JSON.parse(z) : null; } catch (e) { return null; } }
const flaga = f => !!S.flagi[f];
const ustaw = (f, v = true) => { S.flagi[f] = v; zapisz(); };
const ma = p => S.przedmioty.includes(p);
function dodaj(p) { if (!ma(p)) { S.przedmioty.push(p); Dzwiek.zbierz(); zapisz(); blysk = { t: teraz, tekst: 'Nowy przedmiot: ' + PRZEDMIOTY[p].nazwa }; } }
function zabierz(p) { S.przedmioty = S.przedmioty.filter(x => x !== p); if (wybrany === p) wybrany = null; zapisz(); }
function lekcja(id) {
  if (S.lekcje.includes(id)) return;
  S.lekcje.push(id); S.punkty += 100; Dzwiek.sukces(); zapisz();
  blysk = { t: teraz, tekst: '✦ Nowe zaklęcie w Księdze: ' + LEKCJE[id].tytul + ' ✦' };
}
let blysk = null;

/* ---------- gracz ---------- */
const gracz = { x: 520, y: 540, cel: null, kier: 1, faza: 0, idzie: false, poKoncu: null, mowi: false };

/* ---------- wejście ---------- */
let mysz = { x: 0, y: 0 };
let wybrany = null;          // wybrany przedmiot z ekwipunku
let zajety = false;          // trwa scenka
let mowa = null;             // {kto, tekst, rozwiaz, do}
let wybor = null;            // {opcje, rozwiaz, hover}
let mini = null;             // aktywna minigra
let tryb = 'tytul';          // tytul | gra | ksiega | koniec | pomoc
let przejscie = null;        // {t, faza, cel, wej}
let hoverObiekt = null;

function pozMyszy(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
cv.addEventListener('mousemove', e => { mysz = pozMyszy(e); });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('mousedown', e => {
  Dzwiek.start();
  mysz = pozMyszy(e);
  klik(mysz.x, mysz.y, e.button === 2);
});
addEventListener('keydown', e => {
  Dzwiek.start();
  if (mini && mini.klawisz) { mini.klawisz(e); return; }
  if (e.key === 'Escape') {
    if (wybrany) wybrany = null;
    else if (tryb === 'ksiega' || tryb === 'pomoc') tryb = 'gra';
  }
  if ((e.key === ' ' || e.key === 'Enter' || e.key === '.') && mowa) zakonczMowe();
  if (e.key === 'F11' && window.electronAPI) {}
});

/* ---------- mowa i dialogi ---------- */
function powiedz(kto, tekst) {
  return new Promise(r => {
    mowa = { kto, tekst, rozwiaz: r, od: teraz, do: teraz + 1800 + tekst.length * 55 };
    Dzwiek.ton(kto === 'narrator' ? 330 : 500 + rnd(-60, 60), .04, 'triangle', .03);
  });
}
function zakonczMowe() { if (!mowa) return; const r = mowa.rozwiaz; mowa = null; r(); }
async function mow(kto, ...linie) { for (const l of linie) await powiedz(kto, l); }
function wybierz(opcje) {
  return new Promise(r => { wybor = { opcje, rozwiaz: r, hover: -1 }; });
}
async function scenka(fn) {
  if (zajety) return;
  zajety = true;
  try { await fn(); } catch (e) { console.error(e); }
  zajety = false; zapisz();
}
function zwroc(x) { gracz.kier = x < gracz.x ? -1 : 1; }

/* ---------- minigry ---------- */
function uruchomMini(m) {
  return new Promise(r => { m.koniec = v => { mini = null; r(v); }; mini = m; m.start && m.start(); });
}

/* ---------- zmiana sceny ---------- */
function zmienScene(cel, wej) {
  return new Promise(r => { przejscie = { t: teraz, cel, wej, r, zmieniona: false }; });
}
/* ---------- logika kliknięcia ---------- */
function klik(x, y, prawy) {
  if (tryb === 'tytul') { EKRAN_TYTULOWY.klik(x, y); return; }
  if (tryb === 'koniec') { EKRAN_KONCOWY.klik(x, y); return; }
  if (tryb === 'ksiega' || tryb === 'pomoc') { tryb = 'gra'; Dzwiek.klik(); return; }
  if (przejscie) return;
  if (mini) { mini.klik && mini.klik(x, y, prawy); return; }
  if (mowa) { if (teraz - mowa.od > 250) zakonczMowe(); return; }
  if (wybor) {
    const i = opcjaPod(x, y);
    if (i >= 0) { const r = wybor.rozwiaz; wybor = null; Dzwiek.klik(); r(i); }
    return;
  }
  if (y >= SH) { klikPasek(x, y, prawy); return; }
  if (zajety) return;
  if (prawy && wybrany) { wybrany = null; return; }
  const ob = obiektPod(x, y);
  if (ob) {
    if (prawy) { scenka(async () => { zwroc(ob.cx || x); await powiedz('damian', typeof ob.patrz === 'function' ? ob.patrz() : ob.patrz); }); return; }
    const p = wybrany;
    scenka(async () => {
      const [wx, wy] = ob.idz || [x, y];
      if (ob.idz !== false) await idzDo(wx, wy);
      zwroc(ob.cx || x);
      if (p) {
        wybrany = null;
        const h = ob.uzyjZ && ob.uzyjZ[p];
        if (h) await h();
        else await powiedz('damian', losowa([
          'Użycie ' + PRZEDMIOTY[p].dop + ' tutaj nic nie da. Nawet magicznie.',
          'Nie. To tak nie działa. A sprawdzałem.',
          'Gdyby to zadziałało, świat byłby dziwniejszy niż jest. A już jest dość dziwny.'
        ]));
      } else if (ob.uzyj) await ob.uzyj();
      else await powiedz('damian', typeof ob.patrz === 'function' ? ob.patrz() : ob.patrz);
    });
    return;
  }
  if (wybrany) { wybrany = null; return; }
  scenka(async () => { await idzDo(x, y); });
}
const losowa = a => a[Math.floor(Math.random() * a.length)];

function obiektPod(x, y) {
  const sc = SCENY[S.scena];
  const lista = (typeof sc.obiekty === 'function' ? sc.obiekty() : sc.obiekty).filter(o => !o.ukryty || !o.ukryty());
  for (let i = lista.length - 1; i >= 0; i--) {
    const o = lista[i];
    if (o.prost) { const [a, b, c, d] = o.prost; if (x >= a && x <= a + c && y >= b && y <= b + d) return o; }
    else if (o.wiel && wPolu(o.wiel, x, y)) return o;
  }
  return null;
}

/* ---------- pasek UI ---------- */
const PRZYCISKI = [
  { id: 'ksiega', x: 1000, y: 616, w: 130, h: 40, tekst: '📖 Księga' },
  { id: 'podp', x: 1140, y: 616, w: 130, h: 40, tekst: '🦉 Podpowiedź' },
  { id: 'dzw', x: 1000, y: 664, w: 130, h: 40, tekst: '🔊 Dźwięk' },
  { id: 'menu', x: 1140, y: 664, w: 130, h: 40, tekst: '⌂ Menu' },
];
function slotPrzedmiotu(i) { return { x: 20 + i * 92, y: 618, w: 84, h: 84 }; }
function klikPasek(x, y, prawy) {
  for (let i = 0; i < S.przedmioty.length; i++) {
    const s = slotPrzedmiotu(i);
    if (x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h) {
      const p = S.przedmioty[i];
      Dzwiek.klik();
      if (prawy || zajety) { if (!zajety) scenka(() => powiedz('damian', PRZEDMIOTY[p].opis)); return; }
      if (wybrany && wybrany !== p) {
        const k = [wybrany, p].sort().join('+');
        const h = KOMBINACJE[k]; wybrany = null;
        scenka(h || (() => powiedz('damian', 'Te dwie rzeczy do siebie nie pasują. Jak skarpetka i hasło.')));
        return;
      }
      if (PRZEDMIOTY[p].uzyj && wybrany === p) { wybrany = null; scenka(PRZEDMIOTY[p].uzyj); return; }
      wybrany = wybrany === p ? null : p;
      return;
    }
  }
  for (const b of PRZYCISKI) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      Dzwiek.klik();
      if (zajety && b.id !== 'dzw') return;
      if (b.id === 'ksiega') tryb = 'ksiega';
      if (b.id === 'pomoc') tryb = 'pomoc';
      if (b.id === 'dzw') { Dzwiek.wl = !Dzwiek.wl; b.tekst = Dzwiek.wl ? '🔊 Dźwięk' : '🔇 Cisza'; }
      if (b.id === 'menu') { zapisz(); tryb = 'tytul'; }
      if (b.id === 'podp' && !zajety) scenka(() => powiedz('sowa', podpowiedz()));
    }
  }
}
function opcjaPod(x, y) {
  if (!wybor) return -1;
  const n = wybor.opcje.length, h = Math.min(30, 110 / n);
  for (let i = 0; i < n; i++) {
    const oy = SH + 8 + i * h;
    if (y >= oy && y < oy + h && x < 1260) return i;
  }
  return -1;
}
</script>
<script>
"use strict";
/* =====================================================================
   GRAFIKA — tła, postacie i przedmioty rysowane kodem
   ===================================================================== */
function nowyCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function lg(g, x0, y0, x1, y1, stopy) { const gr = g.createLinearGradient(x0, y0, x1, y1); stopy.forEach(([o, k]) => gr.addColorStop(o, k)); return gr; }
function rg(g, x, y, r0, r1, stopy) { const gr = g.createRadialGradient(x, y, r0, x, y, r1); stopy.forEach(([o, k]) => gr.addColorStop(o, k)); return gr; }
const OBRYS = '#1b0f1e';
function wiel(g, pts, fill, stroke = OBRYS, lw = 3) {
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.lineJoin = 'round'; g.stroke(); }
}
function elip(g, x, y, rx, ry, fill, stroke = OBRYS, lw = 3) {
  g.beginPath(); g.ellipse(x, y, Math.abs(rx), Math.abs(ry), 0, 0, Math.PI * 2);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); }
}
function prost(g, x, y, w, h, fill, stroke = OBRYS, lw = 3) {
  g.beginPath(); g.rect(x, y, w, h);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); }
}
function zaokr(g, x, y, w, h, r, fill, stroke = OBRYS, lw = 3) {
  g.beginPath(); g.roundRect(x, y, w, h, r);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); }
}
function szum(g, R, x, y, w, h, n, kolory, rozm = 2) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = kolory[Math.floor(R() * kolory.length)];
    g.fillRect(x + R() * w, y + R() * h, rozm * (0.5 + R()), rozm * (0.5 + R()));
  }
}
function winieta(g, w = W, h = SH, moc = .55) {
  g.fillStyle = rg(g, w / 2, h / 2, h * .35, w * .75, [[0, 'rgba(0,0,0,0)'], [1, `rgba(10,0,20,${moc})`]]);
  g.fillRect(0, 0, w, h);
}
function gwiazdka(g, x, y, r, fill, stroke = OBRYS, lw = 1.5) {
  const pts = [];
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]); }
  wiel(g, pts, fill, stroke, lw);
}
function napis(g, t, x, y, rozm, kolor, align = 'center', font = 'Georgia, serif', obrys = null, waga = 'bold') {
  g.font = `${waga} ${rozm}px ${font}`; g.textAlign = align; g.textBaseline = 'middle';
  if (obrys) { g.strokeStyle = obrys; g.lineWidth = Math.max(3, rozm / 5); g.lineJoin = 'round'; g.strokeText(t, x, y); }
  g.fillStyle = kolor; g.fillText(t, x, y);
}
function kamienneSciany(g, R, x, y, w, h, baza, ciemne, jasne) {
  g.fillStyle = baza; g.fillRect(x, y, w, h);
  for (let ry = y; ry < y + h; ry += 34) {
    let rx = x - R() * 40;
    while (rx < x + w) {
      const sw = 50 + R() * 50;
      g.fillStyle = R() < .5 ? ciemne : jasne;
      g.globalAlpha = .55 + R() * .35;
      zaokr(g, rx + 2, ry + 2, sw - 4, 30, 8, g.fillStyle, 'rgba(20,8,30,.6)', 2);
      g.globalAlpha = 1;
      rx += sw;
    }
  }
}
function deski(g, R, y0, y1, kolA, kolB, zbieg = 640) {
  g.fillStyle = lg(g, 0, y0, 0, y1, [[0, kolA], [1, kolB]]); g.fillRect(0, y0, W, y1 - y0);
  g.strokeStyle = 'rgba(30,12,8,.55)'; g.lineWidth = 2;
  for (let i = -14; i <= 14; i++) {
    g.beginPath(); g.moveTo(zbieg + i * 50, y0); g.lineTo(zbieg + i * 130, y1); g.stroke();
  }
  for (let yy = y0 + 18, k = 1; yy < y1; yy += 14 + k * 6, k++) {
    g.globalAlpha = .25; g.beginPath(); g.moveTo(0, yy); g.lineTo(W, yy); g.stroke(); g.globalAlpha = 1;
  }
  szum(g, R, 0, y0, W, y1 - y0, 900, ['rgba(255,220,170,.06)', 'rgba(0,0,0,.08)'], 3);
}
function bruk(g, R, y0, y1, baza, kam) {
  g.fillStyle = baza; g.fillRect(0, y0, W, y1 - y0);
  for (let yy = y0; yy < y1; yy += 0) {
    const t = (yy - y0) / (y1 - y0), hh = 8 + t * 18;
    for (let xx = -R() * 40; xx < W; xx += hh * 2.2) {
      elip(g, xx + R() * 6, yy + hh / 2, hh * (.9 + R() * .3), hh * .45, kam[Math.floor(R() * kam.length)], 'rgba(40,25,20,.55)', 1.5);
    }
    yy += hh;
