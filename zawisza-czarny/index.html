<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Zawisza Czarny — Mrok nad Krakowem</title>
<meta name="description" content="Strategiczna gra przygodowa o Zawiszy Czarnym w średniowiecznym Krakowie (1409). Dla uczniów 10–12 lat.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#c9a24a; --gold2:#ffd870; --ink:#efe2c4; --panel:rgba(16,11,9,.92); --red:#8e1816; --know:#7ab0e0; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#050304;overflow:hidden;font-family:'Spectral',Georgia,serif;color:var(--ink);}
  #stage{position:absolute;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#000;}
  #cv{position:absolute;inset:0;width:1280px;height:720px;display:block;touch-action:none}
  #fogov{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(6,16,12,0) 35%,rgba(6,16,12,.9) 100%);opacity:0;transition:opacity 1.5s}
  .hidden{display:none!important}
  .ico{vertical-align:middle;border-radius:4px}
  /* przyciski */
  .btn{font-family:'Spectral',Georgia,serif;font-size:17px;color:var(--ink);background:linear-gradient(#3a1612,#24100c);border:2px solid #6a4a24;
    border-radius:6px;padding:9px 16px;cursor:pointer;text-align:left;transition:all .15s;box-shadow:0 3px 0 rgba(0,0,0,.5)}
  .btn:hover:not(:disabled){border-color:var(--gold2);color:#fff;transform:translateY(-1px)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.gold{background:linear-gradient(#7a5a1a,#4a3008);border-color:var(--gold2);color:#fff6dc;font-weight:600}
  .btn.ghost{background:rgba(20,14,10,.7);border-color:#4a3a28}
  .btn.small{font-size:13px;padding:4px 10px}
  .btn small{display:block;font-size:12px;opacity:.75;font-weight:400}
  .pulse{animation:pulse 1.6s infinite}
  @keyframes pulse{50%{box-shadow:0 0 18px rgba(255,216,112,.55),0 3px 0 rgba(0,0,0,.5)}}
  /* ładowanie i tytuł */
  #loading{position:absolute;inset:0;background:#0a0606;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50}
  #loading h1{font-family:'Cinzel',Georgia,serif;color:var(--gold);letter-spacing:.2em;font-size:40px;margin:0 0 20px}
  #loadbar{width:420px;height:10px;border:1px solid var(--gold);border-radius:6px;overflow:hidden}
  #loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8e1816,#ffd870);transition:width .2s}
  #loadtxt{margin-top:12px;font-style:italic;opacity:.8}
  #title{position:absolute;right:70px;top:120px;width:560px;text-align:center;z-index:5}
  #title h1{font-family:'Cinzel',Georgia,serif;font-size:66px;line-height:1;margin:0;color:#f4e2b8;letter-spacing:.08em;
    text-shadow:0 0 30px rgba(180,30,20,.7),0 4px 0 #2a0806,0 6px 20px #000}
  #title h2{font-family:'Cinzel',Georgia,serif;font-size:26px;margin:14px 0 6px;color:var(--gold);letter-spacing:.3em;text-shadow:0 2px 10px #000}
  #title p{font-size:18px;font-style:italic;margin:0 0 30px;text-shadow:0 2px 8px #000}
  #title .btn{display:block;width:300px;margin:12px auto;text-align:center;font-size:20px}
  #title .foot{position:absolute;top:470px;width:100%;font-size:13px;opacity:.7;font-style:normal}
  /* HUD */
  #hud{position:absolute;left:0;right:0;top:0;z-index:4;pointer-events:none;background:linear-gradient(rgba(8,5,4,.92),rgba(8,5,4,.6) 75%,rgba(8,5,4,0))}
  #hud .row{display:flex;align-items:center;justify-content:space-between;padding:6px 14px 0}
  #hud .stats{display:flex;gap:14px;align-items:center;font-size:16px}
  #hud .stats span{display:flex;align-items:center;gap:5px}
  #hud .stats small{font-size:12px;color:var(--know);margin-left:2px}
  .bar{display:inline-block;width:90px;height:10px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden;border:1px solid rgba(201,162,74,.4)}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#8e1816,#e04a3a)}
  .bar.mrok i{background:linear-gradient(90deg,#1a4a3a,#6af0b0)}
  .mrokw b{color:#6af0b0}
  #hud .btns{display:flex;gap:6px;pointer-events:auto}
  #hud .btns .btn{font-size:14px;padding:5px 10px}
  #hud .goal{font-size:15px;max-width:820px;text-shadow:0 1px 4px #000}
  #hud .goal b{color:var(--gold2);font-family:'Cinzel',Georgia,serif;font-size:14px;letter-spacing:.05em}
  #hud .arts{display:flex;gap:4px}
  #hud .art{opacity:.22;filter:grayscale(1)}
  #hud .art.on{opacity:1;filter:none;box-shadow:0 0 10px rgba(255,216,112,.6);border-radius:4px}
  /* panel lokacji */
  #locpanel{position:absolute;right:16px;top:118px;width:380px;background:var(--panel);border:2px solid #6a4a24;border-radius:8px;padding:14px;z-index:3;display:flex;flex-direction:column;gap:8px;max-height:580px;overflow:auto}
  #locpanel h3{font-family:'Cinzel',Georgia,serif;color:var(--gold);margin:0;font-size:20px;letter-spacing:.06em}
  #locpanel .desc{margin:0 0 6px;font-style:italic;opacity:.85;font-size:15px}
  #locpanel .btn{font-size:15px}
  /* dialog */
  #dialog{position:absolute;left:14px;right:14px;bottom:12px;min-height:200px;background:var(--panel);border:2px solid var(--gold);border-radius:10px;z-index:6;display:flex;gap:16px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.8)}
  #dialog canvas{width:150px;height:177px;border:2px solid #6a4a24;border-radius:6px;flex:none}
  #dialog .dbody{flex:1;display:flex;flex-direction:column}
  #dialog .dname{font-family:'Cinzel',Georgia,serif;color:var(--gold2);font-size:21px;letter-spacing:.05em}
  #dialog .dname small{font-family:'Spectral',Georgia,serif;font-style:italic;color:var(--ink);opacity:.7;font-size:14px;margin-left:10px;letter-spacing:0}
  #dialog .dtext{font-size:19px;line-height:1.45;margin:6px 0 10px;min-height:56px;cursor:pointer}
  #dialog .dchoices{display:flex;flex-direction:column;gap:6px}
  .choice{font-size:16px;padding:7px 12px}
  .choice .num{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#1a0e06;text-align:center;font-weight:700;font-size:13px;line-height:22px;margin-right:6px}
  /* modal */
  #modal{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:center;justify-content:center}
  #modal .box{background:var(--panel);border:2px solid var(--gold);border-radius:10px;padding:22px 26px;width:640px;max-height:660px;overflow:auto;box-shadow:0 20px 60px #000;display:flex;flex-direction:column;gap:10px}
  #modal .box.wide{width:1060px}
  #modal .box.center{text-align:center;align-items:center}
  #modal .box.intro{background:rgba(10,6,5,.85);width:820px}
  #modal h1,#modal h2{font-family:'Cinzel',Georgia,serif;color:var(--gold2);margin:0;letter-spacing:.05em}
  #modal h2 small{font-family:'Spectral';font-size:15px;color:var(--ink);opacity:.8;margin-left:10px;letter-spacing:0}
  #modal p{margin:0;font-size:18px;line-height:1.45}
  #modal .hint{font-size:15px;opacity:.75;font-style:italic}
  #modal .good{color:#9af0a0}
  #modal .bad{color:#ff9a7a}
  #modal .res{font-style:italic;color:#f4e2b8}
  #modal .q{font-size:20px;font-weight:600}
  #modal h1.dark{color:#6af0b0;font-size:38px}
  .introtext{font-size:24px!important;line-height:1.55!important;font-style:italic;padding:10px 20px}
  .answers{display:flex;flex-direction:column;gap:8px;width:100%}
  .answer.right{background:linear-gradient(#2a5a2a,#1a3a1a);border-color:#9af0a0;opacity:1!important}
  .answer.wrong{background:linear-gradient(#6a1a14,#3a0a08);border-color:#ff7a5a;opacity:1!important}
  .chap small{font-family:'Cinzel',Georgia,serif;color:var(--gold);letter-spacing:.4em;font-size:16px}
  .chap h1{font-size:44px!important;margin:8px 0!important}
  .chap .where{font-style:italic;color:var(--know)!important;margin-bottom:10px!important}
  .artbox{display:flex;flex-direction:column;align-items:center;gap:8px}
  .artbox img{border:2px solid var(--gold2);border-radius:8px;box-shadow:0 0 30px rgba(255,216,112,.5)}
  /* ekwipunek */
  .inv{display:flex;gap:18px}
  .eqcol{width:320px;display:flex;flex-direction:column;gap:6px}
  .eqcol .hero canvas{border:1px solid #6a4a24;border-radius:6px;display:block;margin:0 auto}
  .slot{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:1px solid #4a3a28;border-radius:6px;padding:4px 8px;font-size:15px}
  .slot span{width:56px;color:var(--gold);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
  .slot b{flex:1}
  .statline{font-size:15px;padding:4px 0;color:var(--ink)}
  .statline b{color:var(--gold2)}
  .rcol{flex:1;display:flex;flex-direction:column;gap:12px}
  .grid{display:grid;grid-template-columns:repeat(7,70px);grid-auto-rows:70px;gap:8px;align-content:start}
  .cell{position:relative;border:2px solid #4a3a28;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(0,0,0,.3)}
  .cell:hover{border-color:var(--gold2)}
  .cell.art{border-color:var(--gold);box-shadow:0 0 10px rgba(255,216,112,.35)}
  .cell em{position:absolute;right:4px;bottom:2px;font-style:normal;font-weight:700;font-size:14px;color:var(--gold2);text-shadow:0 0 4px #000}
  .iteminfo{border-top:1px solid #4a3a28;padding-top:8px;min-height:70px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .iteminfo h3{margin:0;font-family:'Cinzel',Georgia,serif;color:var(--gold2)}
  .iteminfo p{font-size:16px!important}
  /* kronika */
  .codex{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .card{border:1px solid #4a3a28;border-radius:8px;padding:10px 12px;background:rgba(255,255,255,.03);position:relative}
  .card h4{margin:0 0 4px;font-family:'Cinzel',Georgia,serif;color:var(--gold2);font-size:15px;padding-right:70px}
  .card p{font-size:14px!important;line-height:1.4!important}
  .card .tag{position:absolute;right:8px;top:8px;font-size:11px;font-weight:700;letter-spacing:.1em;padding:2px 6px;border-radius:4px;background:#3a3a3a}
  .card.fakt .tag{background:#2a5a3a}.card.legenda .tag{background:#5a3a7a}.card.fikcja .tag{background:#7a2a1a}
  .card.locked{opacity:.4}
  /* sklep */
  .shop{display:flex;flex-direction:column;gap:8px}
  .srow{display:flex;align-items:center;gap:12px;border:1px solid #4a3a28;border-radius:6px;padding:6px 10px;background:rgba(255,255,255,.03)}
  .srow div{flex:1}.srow small{display:block;font-size:13px;opacity:.75;line-height:1.3}
  .srow em{font-size:13px;opacity:.7}
  .owned{color:#9af0a0;font-weight:600;padding:0 10px;font-size:14px}
  .armylist{display:flex;flex-direction:column;gap:6px}
  .arow{border:1px solid #4a3a28;border-radius:6px;padding:6px 10px}.arow small{display:block;opacity:.75}
  .help{margin:0;padding-left:20px;font-size:17px;line-height:1.5;text-align:left}
  .cert{border:3px double var(--gold);padding:20px;border-radius:8px;background:rgba(60,40,20,.25)}
  .cert h1{font-size:36px!important;margin:8px 0!important}
  .certstats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0;font-size:16px;text-align:left}
  /* toasty */
  #toasts{position:absolute;left:50%;margin-left:-270px;top:96px;align-items:center;z-index:30;display:flex;flex-direction:column;gap:6px;pointer-events:none;width:540px}
  .toast{background:rgba(14,10,8,.94);border-left:4px solid var(--gold);padding:7px 12px;border-radius:4px;font-size:15px;animation:tin .3s;transition:opacity .6s,transform .6s}
  .toast.good{border-color:#9af0a0}.toast.bad{border-color:#ff7a5a}.toast.know{border-color:var(--know)}.toast.gold{border-color:var(--gold2)}
  .toast.out{opacity:0;transform:translateX(-20px)}
  @keyframes tin{from{opacity:0;transform:translateX(-20px)}}
  /* minigry */
  #mg{position:absolute;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(rgba(8,5,4,.7),rgba(8,5,4,.95));border-top:2px solid #6a4a24;padding:8px 16px}
  .mgbar{font-size:15px;line-height:1.35;display:flex;align-items:center;gap:14px}
  .mgbar b{color:var(--gold2)}
  .mgbtns{display:flex;gap:8px;align-items:center;margin-left:auto;flex:none}
  .mgbtns span{font-size:14px;color:var(--gold)}
  .mgbar.battle{flex-direction:column;align-items:stretch;gap:6px}
  .bres{display:flex;gap:6px}
  .bres .btn{flex:1;font-size:14px;padding:5px 8px}
  .btn.unit.sel{border-color:var(--gold2);box-shadow:0 0 14px rgba(255,216,112,.6)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div id="fogov"></div>

  <div id="hud" class="hidden">
    <div class="row"><div class="stats"></div>
      <div class="btns"><button class="btn" id="hInv">Ekwipunek [E]</button><button class="btn" id="hCod">Kronika [K]</button><button class="btn" id="hArmy">Poczet [P]</button><button class="btn" id="hHelp">?</button><button class="btn" id="hSnd">Dźwięk: wł.</button><button class="btn" id="hMenu">Menu</button></div></div>
    <div class="row"><div class="goal"></div><div class="arts"></div></div>
  </div>

  <div id="locpanel" class="hidden"></div>

  <div id="dialog" class="hidden">
    <canvas width="220" height="260"></canvas>
    <div class="dbody"><div class="dname"></div><div class="dtext"></div><div class="dchoices"></div></div>
  </div>

  <div id="mg" class="hidden"></div>
  <div id="modal" class="hidden"></div>
  <div id="toasts"></div>

  <div id="title" class="hidden">
    <h1>ZAWISZA<br>CZARNY</h1>
    <h2>MROK NAD KRAKOWEM</h2>
    <p>Kraków, Anno Domini 1409. Pięć skarbów Królestwa zniknęło w ciemności.</p>
    <button class="btn gold" id="bNew">Nowa gra</button>
    <button class="btn hidden" id="bCont">Kontynuuj</button>
    <button class="btn ghost" id="bHelp">Jak grać</button>
  </div>

  <div id="loading"><h1>ZAWISZA CZARNY</h1><div id="loadbar"><i></i></div><div id="loadtxt">Przygotowuję farby…</div></div>
</div>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/minigames.js"></script>
<script src="js/game.js"></script>
</body>
</html>
